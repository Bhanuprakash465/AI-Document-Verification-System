name: backend-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (lightweight; no torch/doctr)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.115.12 "uvicorn[standard]==0.34.2" python-multipart==0.0.20 pydantic==2.13.4 opencv-python==4.11.0.86 "numpy==2.5.1" pillow==12.3.0 sqlalchemy==2.0.41 httpx==0.27.2 pytest==9.1.1
      - name: Run unit tests (no real documents, no OCR weights)
        run: |
          python -m pytest backend/tests/test_classifier.py backend/tests/test_extractors.py backend/tests/test_validation.py -v --no-header
      - name: Run synthetic API tests (heavy OCR test excluded)
        run: |
          python -m pytest backend/tests/test_api.py -v --no-header -k "not real and not persisted and not validation_status_never_claims_authenticity"
